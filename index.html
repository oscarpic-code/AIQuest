<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIQuest</title>
    <meta name="description" content="Aprende sobre inteligencia artificial jugando con noticias reales." />
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8ff;
        --text: #132238;
        --accent: #5b5bff;
        --accent-strong: #4141d8;
        --accent-soft: #e8eaff;
        --success: #1f9d68;
        --danger: #d9534f;
        --card: rgba(255, 255, 255, 0.95);
        --shadow: 0 18px 40px rgba(31, 41, 55, 0.12);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #f7f8ff 0%, #eef3ff 100%);
        color: var(--text);
        min-height: 100vh;
      }

      .app {
        width: min(100%, 1100px);
        margin: 0 auto;
        padding: 24px;
      }

      .screen { display: none; }
      .screen.active { display: block; }

      .splash {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      .splash-card {
        background: var(--card);
        padding: 48px 36px;
        border-radius: 28px;
        box-shadow: var(--shadow);
        opacity: 1;
        transform: none;
        transition: all 0.6s ease;
      }

      .splash-card.visible {
        opacity: 1;
        transform: translateY(0);
      }

      .title {
        margin: 0 0 10px;
        font-size: clamp(3rem, 7vw, 5rem);
        font-weight: 800;
        letter-spacing: 0.04em;
        color: var(--accent-strong);
      }

      .subtitle {
        margin: 0 0 22px;
        font-size: 1.05rem;
        color: #52607a;
      }

      .btn {
        border: 0;
        border-radius: 999px;
        padding: 13px 22px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
        color: white;
        box-shadow: 0 10px 20px rgba(91, 91, 255, 0.24);
        transition: transform 0.18s ease, box-shadow 0.18s ease;
      }

      .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(91, 91, 255, 0.28); }
      .btn-secondary { background: #f2f4ff; color: var(--accent-strong); box-shadow: none; }

      .game-shell {
        background: var(--card);
        border-radius: 28px;
        padding: 28px;
        box-shadow: var(--shadow);
      }

      .header {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: center;
        margin-bottom: 18px;
      }

      .eyebrow {
        margin: 0 0 6px;
        text-transform: uppercase;
        letter-spacing: 0.16em;
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--accent);
      }

      h2 { margin: 0; font-size: clamp(1.3rem, 3vw, 1.8rem); }

      .status {
        margin: 0 0 20px;
        color: #5b6780;
        line-height: 1.5;
      }

      .options {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }

      .option {
        border: 2px solid #e8ebf6;
        background: white;
        border-radius: 18px;
        padding: 18px;
        text-align: left;
        min-height: 120px;
        cursor: pointer;
        font-size: 1rem;
        line-height: 1.45;
        color: var(--text);
        transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
      }

      .option:hover {
        transform: translateY(-2px);
        border-color: var(--accent);
        box-shadow: 0 10px 18px rgba(91, 91, 255, 0.12);
      }

      .option.correct {
        border-color: var(--success);
        background: #eefcf5;
      }

      .option.wrong {
        border-color: var(--danger);
        background: #fff1f0;
      }

      .feedback {
        margin-top: 18px;
        border-radius: 16px;
        padding: 16px;
        background: #f7f8ff;
        border: 1px solid #e3e7f1;
      }

      .feedback strong { display: block; margin-bottom: 8px; }
      .feedback a { color: var(--accent-strong); font-weight: 700; }

      .hint {
        font-size: 0.9rem;
        color: #64748b;
        margin-top: 8px;
      }

      .summary {
        margin-top: 10px;
        color: var(--text);
        line-height: 1.55;
        font-size: 0.95rem;
      }

      @media (max-width: 760px) {
        .app { padding: 18px; }
        .options { grid-template-columns: 1fr; }
        .header { flex-direction: column; align-items: flex-start; }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section id="splash" class="screen active">
        <div id="splashCard" class="splash-card">
          <h1 class="title">AIQUEST</h1>
          <p class="subtitle">Aprende sobre inteligencia artificial jugando con noticias reales.</p>
          <button id="startBtn" class="btn">Comenzar</button>
        </div>
      </section>

      <section id="game" class="screen">
        <div class="game-shell">
          <div class="header">
            <div>
              <p class="eyebrow">Mini juego</p>
              <h2>¿Cuál es el titular real?</h2>
            </div>
            <button id="nextBtn" class="btn btn-secondary">Otra ronda</button>
          </div>

          <p id="statusText" class="status">Estamos buscando una noticia reciente sobre IA para que practiques.</p>
          <div id="options" class="options"></div>
          <div id="feedback" class="feedback" hidden></div>
        </div>
      </section>
    </main>

    <script src="antonyms.js"></script>
    <script>
      const splashScreen = document.getElementById('splash');
      const gameScreen = document.getElementById('game');
      const splashCard = document.getElementById('splashCard');
      const startBtn = document.getElementById('startBtn');
      const nextBtn = document.getElementById('nextBtn');
      const statusText = document.getElementById('statusText');
      const optionsContainer = document.getElementById('options');
      const feedbackBox = document.getElementById('feedback');

      let currentCorrectTitle = '';
      let currentLink = '';
      let recentArticleLinks = [];
      const summaryCache = new Map();
      const pendingSummaryRequests = new Map();

      const newsFeedUrl = 'https://news.google.com/rss/search?q=IA%20inteligencia%20artificial&hl=es&gl=ES&ceid=ES:es';
      const newsProxyUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(newsFeedUrl)}`;
      const antonymMap = window.antonymMap || {};

      function showScreen(screenId) {
        splashScreen.classList.remove('active');
        gameScreen.classList.remove('active');
        document.getElementById(screenId).classList.add('active');
      }

      function startExperience() {
        showScreen('game');
        loadRound();
      }

      function normalizeText(text) {
        return text.replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim();
      }

      function getReplaceableWords(text) {
        const words = normalizeText(text)
          .split(/\s+/)
          .map(word => word.replace(/[¿?¡!.,;:()]/g, ''))
          .filter(Boolean)
          .filter(word => /[a-zA-ZáéíóúÁÉÍÓÚñÑ]/.test(word));

        const seen = new Set();
        return words.filter(word => {
          const normalized = word.toLowerCase();
          if (seen.has(normalized)) return false;
          seen.add(normalized);
          const antonyms = antonymMap[normalized];
          return Boolean(antonyms && antonyms.length);
        });
      }

      function replaceWordWithAntonym(text, wordToReplace, excludedWords = []) {
        const target = wordToReplace.toLowerCase();
        const words = text.split(/(\s+)/);
        let replaced = false;

        const result = words.map(part => {
          if (replaced) return part;

          const cleanedPart = part.replace(/[¿?¡!.,;:()]/g, '');
          if (!cleanedPart) return part;

          const normalizedPart = cleanedPart.toLowerCase();
          if (normalizedPart === target && !excludedWords.includes(normalizedPart)) {
            const antonyms = antonymMap[normalizedPart];
            if (antonyms && antonyms.length) {
              replaced = true;
              return antonyms[Math.floor(Math.random() * antonyms.length)];
            }
          }

          return part;
        }).join('');

        return replaced ? result : null;
      }

      function buildVariantTitles(correctTitle) {
        const title = normalizeText(correctTitle);
        const replaceableWords = getReplaceableWords(title);

        if (replaceableWords.length < 2) {
          return null;
        }

        const firstWord = replaceableWords[0];
        const secondWord = replaceableWords.find(word => word.toLowerCase() !== firstWord.toLowerCase());

        if (!secondWord) {
          return null;
        }

        const firstVariant = replaceWordWithAntonym(title, firstWord);
        const secondVariant = replaceWordWithAntonym(title, secondWord, [firstWord.toLowerCase()]);

        if (!firstVariant || !secondVariant) {
          return null;
        }

        return [title, firstVariant, secondVariant].filter((value, index, array) => value && array.indexOf(value) === index);
      }

      async function fetchNewsHeadlines(maxItems = 12) {
        try {
          const response = await fetch(newsProxyUrl);
          if (!response.ok) throw new Error('No se pudo obtener la fuente');
          const data = await response.json();
          return (data.items || [])
            .map(item => ({
              title: normalizeText(item.title),
              link: item.link,
              description: normalizeText(item.description)
            }))
            .filter(item => item.title && item.link)
            .slice(0, maxItems);
        } catch (error) {
          console.warn('No se pudieron cargar titulares recientes:', error);
          return [];
        }
      }

      function buildOptions(newsItems) {
        const availableArticles = newsItems.filter(article => !recentArticleLinks.includes(article.link));
        const candidateArticles = availableArticles.length ? availableArticles : newsItems;
        const shuffledItems = [...candidateArticles].sort(() => Math.random() - 0.5);

        for (const article of shuffledItems) {
          const variants = buildVariantTitles(article.title);
          if (variants && variants.length >= 3) {
            const options = variants.sort(() => Math.random() - 0.5);
            recentArticleLinks.push(article.link);
            if (recentArticleLinks.length > 4) {
              recentArticleLinks.shift();
            }
            return { options, correctArticle: article };
          }
        }

        return null;
      }

      function renderOptions(options, correctArticle) {
        optionsContainer.innerHTML = '';
        options.forEach(option => {
          const btn = document.createElement('button');
          btn.className = 'option';
          btn.textContent = option;
          btn.addEventListener('click', () => handleAnswer(option, correctArticle));
          optionsContainer.appendChild(btn);
        });

        currentCorrectTitle = correctArticle.title;
        currentLink = correctArticle.link;
      }

      function formatLink(link) {
        if (!link) return '';
        return link.length > 30 ? `${link.slice(0, 30)}...` : link;
      }

      function normalizeSummaryText(text) {
        return text.replace(/\s+/g, ' ').trim();
      }

      function extractJinaContent(rawText) {
        if (!rawText) return '';

        const normalized = rawText.replace(/\r/g, '');
        const lines = normalized.split('\n').map(line => line.trim()).filter(Boolean);

        const headerPatterns = [
          /^Title:/i,
          /^URL:/i,
          /^Source:/i,
          /^Markdown Content:/i,
          /^Content:/i,
          /^Summary:/i,
          /^# /,
          /^## /
        ];

        const contentLines = lines.filter(line => !headerPatterns.some(pattern => pattern.test(line)));

        if (contentLines.length) {
          return contentLines.join(' ');
        }

        const cleaned = normalized
          .replace(/^Title:\s.*?\n/i, '')
          .replace(/^URL:\s.*?\n/i, '')
          .replace(/^Source:\s.*?\n/i, '')
          .replace(/^Markdown Content:\s*/i, '')
          .replace(/^Content:\s*/i, '')
          .replace(/^Summary:\s*/i, '')
          .trim();

        return cleaned;
      }

      function splitIntoSentences(text) {
        return text
          .split(/(?<=[.!?])\s+/)
          .map(sentence => sentence.replace(/\s+/g, ' ').trim())
          .filter(Boolean);
      }

      function summarizeWithExtractiveAlgorithm(text) {
        const sentences = splitIntoSentences(text);
        if (!sentences.length) return '';
        if (sentences.length === 1) return normalizeSummaryText(sentences[0]);

        const stopWords = new Set(['el', 'la', 'de', 'que', 'y', 'a', 'en', 'un', 'una', 'los', 'las', 'del', 'al', 'por', 'para', 'con', 'su', 'sus', 'se', 'como', 'ha', 'han', 'este', 'esta', 'es', 'son', 'pero', 'más', 'una', 'sobre', 'sin', 'entre', 'después', 'cuando', 'también', 'fue', 'ser', 'tener']);
        const frequency = new Map();
        const tokenizedText = text
          .toLowerCase()
          .replace(/[^\p{L}\p{N}\s]/gu, ' ')
          .split(/\s+/)
          .filter(token => token && !stopWords.has(token));

        tokenizedText.forEach(token => {
          frequency.set(token, (frequency.get(token) || 0) + 1);
        });

        const scoredSentences = sentences.map((sentence, index) => {
          const sentenceTokens = sentence
            .toLowerCase()
            .replace(/[^\p{L}\p{N}\s]/gu, ' ')
            .split(/\s+/)
            .filter(Boolean);

          const score = sentenceTokens.reduce((total, token) => total + (frequency.get(token) || 0), 0);
          return { index, sentence, score };
        });

        const selectedSentences = scoredSentences
          .sort((a, b) => b.score - a.score || a.index - b.index)
          .slice(0, Math.min(3, sentences.length))
          .sort((a, b) => a.index - b.index);

        const summary = selectedSentences.map(item => item.sentence).join(' ');
        const words = summary.split(/\s+/);
        if (words.length > 60) {
          return `${words.slice(0, 60).join(' ')}...`;
        }
        return normalizeSummaryText(summary);
      }

      async function summarizeWithBrowserAI(text) {
        const aiApi = window.ai;
        const candidates = [
          aiApi?.summarize,
          aiApi?.summarizer?.summarize,
          aiApi?.summarizer?.createSummary
        ];

        for (const candidate of candidates) {
          if (typeof candidate !== 'function') continue;

          try {
            const result = await candidate(text);
            const summary = typeof result === 'string' ? result : result?.summary || result?.text || '';
            if (summary && summary.trim()) return normalizeSummaryText(summary);
          } catch (error) {
            console.warn('No se pudo usar la API de resumen del navegador:', error);
          }

          try {
            const result = await candidate({ text, maxLength: 160 });
            const summary = typeof result === 'string' ? result : result?.summary || result?.text || '';
            if (summary && summary.trim()) return normalizeSummaryText(summary);
          } catch (error) {
            console.warn('No se pudo usar la API de resumen del navegador con formato alternativo:', error);
          }
        }

        return '';
      }

      async function getArticleSummary(article) {
        const url = article?.link || article?.url || '';
        if (!url) return '';

        const cacheKey = url.trim().replace(/\/$/, '');
        if (summaryCache.has(cacheKey)) {
          return summaryCache.get(cacheKey);
        }

        if (pendingSummaryRequests.has(cacheKey)) {
          return pendingSummaryRequests.get(cacheKey);
        }

        const pendingRequest = (async () => {
          try {
            const response = await fetch(`https://r.jina.ai/http://${url}`, {
              headers: {
                Accept: 'text/plain'
              }
            });

            if (!response.ok) {
              throw new Error(`No se pudo leer la noticia (${response.status})`);
            }

            const rawText = await response.text();
            const jinaContent = extractJinaContent(rawText);
            let summary = await summarizeWithBrowserAI(jinaContent || rawText);
            if (!summary) {
              summary = summarizeWithExtractiveAlgorithm(jinaContent || rawText);
            }

            if (!summary) {
              throw new Error('Resumen vacío');
            }

            summaryCache.set(cacheKey, summary);
            return summary;
          } catch (error) {
            console.warn('No se pudo generar el resumen:', error);
            const fallbackMessage = 'No ha sido posible generar el resumen.';
            summaryCache.set(cacheKey, fallbackMessage);
            return fallbackMessage;
          } finally {
            pendingSummaryRequests.delete(cacheKey);
          }
        })();

        pendingSummaryRequests.set(cacheKey, pendingRequest);
        return pendingRequest;
      }

      async function handleAnswer(selected, correctArticle) {
        const buttons = Array.from(optionsContainer.querySelectorAll('.option'));
        buttons.forEach(button => {
          const isCorrect = button.textContent === correctArticle.title;
          button.classList.toggle('correct', isCorrect);
          button.disabled = true;
        });

        const shortLink = formatLink(correctArticle.link);
        const summaryPlaceholder = '<p class="hint summary">Generando resumen...</p>';

        if (selected === correctArticle.title) {
          feedbackBox.innerHTML = `<strong>¡Correcto!</strong><p>Has elegido el titular real.</p><p class="hint">Lee la noticia original aquí: <a href="${correctArticle.link}" target="_blank" rel="noreferrer">${shortLink}</a></p>${summaryPlaceholder}`;
        } else {
          feedbackBox.innerHTML = `<strong>¡Buen intento!</strong><p>El titular correcto es:</p><p><strong>${correctArticle.title}</strong></p><p class="hint">Puedes abrir la noticia original aquí: <a href="${correctArticle.link}" target="_blank" rel="noreferrer">${shortLink}</a></p>${summaryPlaceholder}`;
        }

        feedbackBox.hidden = false;

        const summary = await getArticleSummary(correctArticle);
        const summaryHtml = `<p class="summary"><strong>Resumen:</strong> ${summary}</p>`;
        feedbackBox.insertAdjacentHTML('beforeend', summaryHtml);
      }

      async function loadRound() {
        statusText.textContent = 'Estamos recopilando titulares recientes sobre IA para que practiques.';
        feedbackBox.hidden = true;
        feedbackBox.innerHTML = '';
        optionsContainer.innerHTML = '<p class="hint">Cargando titulares...</p>';

        const newsItems = await fetchNewsHeadlines(15);
        if (newsItems.length < 3) {
          optionsContainer.innerHTML = '<p class="hint">No se pudieron cargar titulares en este momento. Inténtalo de nuevo.</p>';
          return;
        }

        const builtOptions = buildOptions(newsItems);
        if (!builtOptions) {
          optionsContainer.innerHTML = '<p class="hint">No se pudo encontrar un titular con palabras modificables en este momento. Inténtalo de nuevo.</p>';
          return;
        }

        const { options, correctArticle } = builtOptions;
        renderOptions(options, correctArticle);
        statusText.textContent = 'Elige el titular que corresponde a la noticia que está en juego.';
      }

      function initializeApp() {
        try {
          splashCard.classList.add('visible');
          showScreen('splash');
          startBtn.addEventListener('click', startExperience);
          nextBtn.addEventListener('click', loadRound);
        } catch (error) {
          console.error('No se pudo inicializar la app:', error);
          splashCard.classList.add('visible');
          showScreen('splash');
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initializeApp);
      } else {
        initializeApp();
      }
    </script>
  </body>
</html>
