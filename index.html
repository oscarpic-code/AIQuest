<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIQuest</title>
    <meta name="description" content="Aprende sobre inteligencia artificial jugando con noticias reales." />
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8ff;
        --text: #132238;
        --accent: #5b5bff;
        --accent-strong: #4141d8;
        --accent-soft: #e8eaff;
        --success: #1f9d68;
        --danger: #d9534f;
        --card: rgba(255, 255, 255, 0.95);
        --shadow: 0 18px 40px rgba(31, 41, 55, 0.12);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #f7f8ff 0%, #eef3ff 100%);
        color: var(--text);
        min-height: 100vh;
      }

      .app {
        width: min(100%, 1100px);
        margin: 0 auto;
        padding: 24px;
      }

      .screen { display: none; }
      .screen.active { display: block; }

      .splash {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      .splash-card {
        background: var(--card);
        padding: 48px 36px;
        border-radius: 28px;
        box-shadow: var(--shadow);
        opacity: 1;
        transform: none;
        transition: all 0.6s ease;
      }

      .splash-card.visible {
        opacity: 1;
        transform: translateY(0);
      }

      .title {
        margin: 0 0 10px;
        font-size: clamp(3rem, 7vw, 5rem);
        font-weight: 800;
        letter-spacing: 0.04em;
        color: var(--accent-strong);
      }

      .subtitle {
        margin: 0 0 22px;
        font-size: 1.05rem;
        color: #52607a;
      }

      .btn {
        border: 0;
        border-radius: 999px;
        padding: 13px 22px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
        color: white;
        box-shadow: 0 10px 20px rgba(91, 91, 255, 0.24);
        transition: transform 0.18s ease, box-shadow 0.18s ease;
      }

      .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(91, 91, 255, 0.28); }
      .btn-secondary { background: #f2f4ff; color: var(--accent-strong); box-shadow: none; }

      .game-shell {
        background: var(--card);
        border-radius: 28px;
        padding: 28px;
        box-shadow: var(--shadow);
      }

      .header {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: center;
        margin-bottom: 18px;
      }

      .eyebrow {
        margin: 0 0 6px;
        text-transform: uppercase;
        letter-spacing: 0.16em;
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--accent);
      }

      h2 { margin: 0; font-size: clamp(1.3rem, 3vw, 1.8rem); }

      .status {
        margin: 0 0 20px;
        color: #5b6780;
        line-height: 1.5;
      }

      .options {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }

      .option {
        border: 2px solid #e8ebf6;
        background: white;
        border-radius: 18px;
        padding: 18px;
        text-align: left;
        min-height: 120px;
        cursor: pointer;
        font-size: 1rem;
        line-height: 1.45;
        color: var(--text);
        transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
      }

      .option:hover {
        transform: translateY(-2px);
        border-color: var(--accent);
        box-shadow: 0 10px 18px rgba(91, 91, 255, 0.12);
      }

      .option.correct {
        border-color: var(--success);
        background: #eefcf5;
      }

      .option.wrong {
        border-color: var(--danger);
        background: #fff1f0;
      }

      .feedback {
        margin-top: 18px;
        border-radius: 16px;
        padding: 16px;
        background: #f7f8ff;
        border: 1px solid #e3e7f1;
      }

      .feedback strong { display: block; margin-bottom: 8px; }
      .feedback a { color: var(--accent-strong); font-weight: 700; }

      .hint {
        font-size: 0.9rem;
        color: #64748b;
        margin-top: 8px;
      }

      .summary {
        margin-top: 10px;
        color: var(--text);
        line-height: 1.55;
        font-size: 0.95rem;
      }

      .summary-link {
        display: inline-block;
        margin-top: 10px;
        color: var(--accent-strong);
        font-weight: 700;
        text-decoration: none;
      }

      .summary-link:hover {
        text-decoration: underline;
      }

      @media (max-width: 760px) {
        .app { padding: 18px; }
        .options { grid-template-columns: 1fr; }
        .header { flex-direction: column; align-items: flex-start; }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section id="splash" class="screen active">
        <div id="splashCard" class="splash-card">
          <h1 class="title">AIQUEST</h1>
          <p class="subtitle">Aprende sobre inteligencia artificial jugando con noticias reales.</p>
          <button id="startBtn" class="btn">Comenzar</button>
        </div>
      </section>

      <section id="game" class="screen">
        <div class="game-shell">
          <div class="header">
            <div>
              <p class="eyebrow">Mini juego</p>
              <h2>¿Cuál es el titular real?</h2>
            </div>
            <button id="nextBtn" class="btn btn-secondary">Otra ronda</button>
          </div>

          <p id="statusText" class="status">Estamos buscando una noticia reciente sobre IA para que practiques.</p>
          <div id="options" class="options"></div>
          <div id="feedback" class="feedback" hidden></div>
        </div>
      </section>
    </main>

    <script src="antonyms.js"></script>
    <script>
      const splashScreen = document.getElementById('splash');
      const gameScreen = document.getElementById('game');
      const splashCard = document.getElementById('splashCard');
      const startBtn = document.getElementById('startBtn');
      const nextBtn = document.getElementById('nextBtn');
      const statusText = document.getElementById('statusText');
      const optionsContainer = document.getElementById('options');
      const feedbackBox = document.getElementById('feedback');

      let currentCorrectTitle = '';
      let currentLink = '';
      let recentArticleLinks = [];
      const newsFeedUrls = [
        'https://www.theverge.com/rss/index.xml',
        'https://feeds.feedburner.com/TechCrunch/',
        'https://hnrss.org/newest'
      ];
      const antonymMap = window.antonymMap || {};

      function showScreen(screenId) {
        splashScreen.classList.remove('active');
        gameScreen.classList.remove('active');
        document.getElementById(screenId).classList.add('active');
      }

      function startExperience() {
        showScreen('game');
        loadRound();
      }

      function normalizeText(text) {
        return text.replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim();
      }

      function getReplaceableWords(text) {
        const words = normalizeText(text)
          .split(/\s+/)
          .map(word => word.replace(/[¿?¡!.,;:()]/g, ''))
          .filter(Boolean)
          .filter(word => /[a-zA-ZáéíóúÁÉÍÓÚñÑ]/.test(word));

        const seen = new Set();
        return words.filter(word => {
          const normalized = word.toLowerCase();
          if (seen.has(normalized)) return false;
          seen.add(normalized);
          const antonyms = antonymMap[normalized];
          return Boolean(antonyms && antonyms.length);
        });
      }

      function replaceWordWithAntonym(text, wordToReplace, excludedWords = []) {
        const target = wordToReplace.toLowerCase();
        const words = text.split(/(\s+)/);
        let replaced = false;

        const result = words.map(part => {
          if (replaced) return part;

          const cleanedPart = part.replace(/[¿?¡!.,;:()]/g, '');
          if (!cleanedPart) return part;

          const normalizedPart = cleanedPart.toLowerCase();
          if (normalizedPart === target && !excludedWords.includes(normalizedPart)) {
            const antonyms = antonymMap[normalizedPart];
            if (antonyms && antonyms.length) {
              replaced = true;
              return antonyms[Math.floor(Math.random() * antonyms.length)];
            }
          }

          return part;
        }).join('');

        return replaced ? result : null;
      }

      function buildVariantTitles(correctTitle, fallbackTitle = '') {
        const title = normalizeText(correctTitle);
        const variants = [title];
        const replaceableWords = getReplaceableWords(title);

        if (replaceableWords.length) {
          const firstWord = replaceableWords[0];
          const firstVariant = replaceWordWithAntonym(title, firstWord);
          if (firstVariant) {
            variants.push(firstVariant);
          }

          const secondWord = replaceableWords.find(word => word.toLowerCase() !== firstWord.toLowerCase());
          if (secondWord) {
            const secondVariant = replaceWordWithAntonym(title, secondWord, [firstWord.toLowerCase()]);
            if (secondVariant) {
              variants.push(secondVariant);
            }
          }
        }

        if (variants.length < 3 && fallbackTitle) {
          const fallbackNormalized = normalizeText(fallbackTitle);
          const fallbackWords = getReplaceableWords(fallbackNormalized);

          if (fallbackWords.length) {
            const fallbackVariant = replaceWordWithAntonym(fallbackNormalized, fallbackWords[0]);
            if (fallbackVariant && fallbackVariant !== title) {
              variants.push(fallbackVariant);
            }
          }

          if (variants.length < 3 && fallbackNormalized !== title) {
            variants.push(fallbackNormalized);
          }
        }

        return [...new Set(variants.filter(Boolean))].slice(0, 3);
      }

      function extractUrlsFromText(text) {
        if (!text) return [];
        const regex = /https?:\/\/[^\s"'<>]+/g;
        return [...text.matchAll(regex)].map(match => match[0].replace(/[),.;:!?]+$/, ''));
      }

      function normalizeArticleUrl(url) {
        if (!url) return '';

        try {
          const parsedUrl = new URL(url);
          const target = parsedUrl.searchParams.get('url');
          if (target) {
            return decodeURIComponent(target);
          }
        } catch (error) {
          console.warn('No se pudo normalizar la URL:', error);
        }

        return url;
      }

      function resolveArticleUrl(item) {
        const candidates = [item?.link, item?.guid, item?.url, item?.content, item?.description, item?.contentSnippet];

        for (const candidate of candidates) {
          if (!candidate) continue;

          const urls = extractUrlsFromText(candidate);
          for (const rawUrl of urls) {
            const normalized = normalizeArticleUrl(rawUrl);
            const isFeedRedirect = /news\.google\.com\/rss|rss2json\.com|google\.com\/url\?/.test(normalized);
            if (normalized && !isFeedRedirect) {
              return normalized;
            }
          }
        }

        return item?.link || '';
      }

      async function fetchNewsHeadlines(maxItems = 12) {
        const collectedItems = [];

        for (const feedUrl of newsFeedUrls) {
          try {
            const proxyUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feedUrl)}`;
            const response = await fetch(proxyUrl);
            if (!response.ok) continue;

            const data = await response.json();
            const mappedItems = (data.items || [])
              .map(item => ({
                title: normalizeText(item.title),
                link: resolveArticleUrl(item),
                description: normalizeText(item.description)
              }))
              .filter(item => item.title && item.link);

            collectedItems.push(...mappedItems);
            if (collectedItems.length >= maxItems) break;
          } catch (error) {
            console.warn(`No se pudo cargar la fuente ${feedUrl}:`, error);
          }
        }

        const uniqueItems = [];
        const seenLinks = new Set();

        for (const item of collectedItems) {
          if (seenLinks.has(item.link)) continue;
          seenLinks.add(item.link);
          uniqueItems.push(item);
        }

        return uniqueItems.slice(0, maxItems);
      }

      function buildOptions(newsItems) {
        const availableArticles = newsItems.filter(article => !recentArticleLinks.includes(article.link));
        const candidateArticles = availableArticles.length ? availableArticles : newsItems;
        const shuffledItems = [...candidateArticles].sort(() => Math.random() - 0.5);

        for (let index = 0; index < shuffledItems.length; index += 1) {
          const article = shuffledItems[index];
          const fallbackArticle = shuffledItems[index + 1] || shuffledItems[0];
          const variants = buildVariantTitles(article.title, fallbackArticle?.title);

          if (variants && variants.length >= 2) {
            const options = [...variants].sort(() => Math.random() - 0.5);
            recentArticleLinks.push(article.link);
            if (recentArticleLinks.length > 4) {
              recentArticleLinks.shift();
            }
            return { options, correctArticle: article };
          }
        }

        return null;
      }

      function renderOptions(options, correctArticle) {
        optionsContainer.innerHTML = '';
        options.forEach(option => {
          const btn = document.createElement('button');
          btn.className = 'option';
          btn.textContent = option;
          btn.addEventListener('click', () => handleAnswer(option, correctArticle));
          optionsContainer.appendChild(btn);
        });

        currentCorrectTitle = correctArticle.title;
        currentLink = correctArticle.link;
      }

      function formatLink(link) {
        if (!link) return '';
        return link.length > 30 ? `${link.slice(0, 30)}...` : link;
      }

      function buildAiSummaryUrl(article) {
        const url = article?.link || article?.url || '';
        if (!url) return '';
        const title = article?.title ? `Título: ${article.title}. ` : '';
        const prompt = `Resume esta noticia en 3 puntos muy breves y claros. ${title}URL: ${url}`;
        return `https://www.perplexity.ai/search?q=${encodeURIComponent(prompt)}`;
      }

      function createSummaryLink(article) {
        const url = article?.link || article?.url || '';
        if (!url) return '';
        return `<a class="summary-link" href="${buildAiSummaryUrl(article)}" target="_blank" rel="noreferrer">Abrir resumen con IA</a>`;
      }

      async function handleAnswer(selected, correctArticle) {
        const buttons = Array.from(optionsContainer.querySelectorAll('.option'));
        buttons.forEach(button => {
          const isCorrect = button.textContent === correctArticle.title;
          button.classList.toggle('correct', isCorrect);
          button.disabled = true;
        });

        const shortLink = formatLink(correctArticle.link);
        const summaryLink = createSummaryLink(correctArticle);

        if (selected === correctArticle.title) {
          feedbackBox.innerHTML = `<strong>¡Correcto!</strong><p>Has elegido el titular real.</p><p class="hint">Lee la noticia original aquí: <a href="${correctArticle.link}" target="_blank" rel="noreferrer">${shortLink}</a></p>${summaryLink}`;
        } else {
          feedbackBox.innerHTML = `<strong>¡Buen intento!</strong><p>El titular correcto es:</p><p><strong>${correctArticle.title}</strong></p><p class="hint">Puedes abrir la noticia original aquí: <a href="${correctArticle.link}" target="_blank" rel="noreferrer">${shortLink}</a></p>${summaryLink}`;
        }

        feedbackBox.insertAdjacentHTML('beforeend', '<p class="hint">Abre el resumen con una IA gratuita desde el enlace anterior.</p>');
        feedbackBox.hidden = false;
      }

      async function loadRound() {
        statusText.textContent = 'Estamos recopilando titulares recientes sobre IA para que practiques.';
        feedbackBox.hidden = true;
        feedbackBox.innerHTML = '';
        optionsContainer.innerHTML = '<p class="hint">Cargando titulares...</p>';

        const newsItems = await fetchNewsHeadlines(15);
        if (newsItems.length < 3) {
          optionsContainer.innerHTML = '<p class="hint">No se pudieron cargar titulares en este momento. Inténtalo de nuevo.</p>';
          return;
        }

        const builtOptions = buildOptions(newsItems);
        if (!builtOptions) {
          optionsContainer.innerHTML = '<p class="hint">No se pudo encontrar un titular con palabras modificables en este momento. Inténtalo de nuevo.</p>';
          return;
        }

        const { options, correctArticle } = builtOptions;
        renderOptions(options, correctArticle);
        statusText.textContent = 'Elige el titular que corresponde a la noticia que está en juego.';
      }

      function initializeApp() {
        try {
          splashCard.classList.add('visible');
          showScreen('splash');
          startBtn.addEventListener('click', startExperience);
          nextBtn.addEventListener('click', loadRound);
        } catch (error) {
          console.error('No se pudo inicializar la app:', error);
          splashCard.classList.add('visible');
          showScreen('splash');
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initializeApp);
      } else {
        initializeApp();
      }
    </script>
  </body>
</html>
